<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PravasiShram AI | Consent-Driven Migration Intelligence for Better Welfare Planning</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: #060A18; margin: 0; padding: 1.5rem 0;">
  <section id="intelligence" class="section-wrap alt-surface">
      <div class="content-container">
        <div class="section-header">
          <span class="section-category"><i class="fa-solid fa-satellite-dish"></i> MACRO CORRIDOR MAPPING</span>
          <h2 class="section-title">Migration Intelligence</h2>
          <p class="section-subtitle">From individual check-ins to aggregated movement patterns. Real-time corridor telemetry without tracking individuals.</p>
        </div>

        <div class="intel-grid">
          <!-- Left: Interactive Map -->
          <div class="map-control-card">
            <!-- Filter Controls -->
            <div class="map-filters-bar">
              <div class="form-group">
                <label for="filterState">Filter Origin/Dest</label>
                <select id="filterState" class="form-select" style="padding:0.4rem 0.6rem; font-size:0.8rem;">
                  <option value="all">All States</option>
                  <option value="bihar">Bihar</option>
                  <option value="gujarat">Gujarat</option>
                  <option value="uttar pradesh">Uttar Pradesh</option>
                  <option value="maharashtra">Maharashtra</option>
                  <option value="odisha">Odisha</option>
                  <option value="rajasthan">Rajasthan</option>
                  <option value="west bengal">West Bengal</option>
                </select>
              </div>

              <div class="form-group">
                <label for="filterSector">Trade / Sector</label>
                <select id="filterSector" class="form-select" style="padding:0.4rem 0.6rem; font-size:0.8rem;">
                  <option value="all">All Sectors</option>
                  <option value="textile">Textile & Loom</option>
                  <option value="construction">Construction</option>
                  <option value="diamond">Diamond Polishing</option>
                  <option value="manufacturing">Manufacturing</option>
                  <option value="garments">Garments</option>
                </select>
              </div>

              <div class="form-group">
                <label for="filterType">Migration Type</label>
                <select id="filterType" class="form-select" style="padding:0.4rem 0.6rem; font-size:0.8rem;">
                  <option value="all">All Types</option>
                  <option value="inter-state">Inter-state</option>
                  <option value="intra-state">Intra-state</option>
                </select>
              </div>
            </div>

            <!-- SVG India Canvas -->
            <div class="map-viewport-frame">
              <svg id="indiaMapSvg" viewBox="0 0 600 680" width="100%" height="100%" style="display:block;">
                <defs>
                  <linearGradient id="gradCorridor" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f97316" />
                    <stop offset="100%" stop-color="#2563eb" />
                  </linearGradient>
                </defs>

                <!-- Base India Map Outline (Synthetic Vector Geometry) -->
                <path d="M 270 40 L 310 90 L 340 140 L 390 180 L 460 210 L 510 240 L 530 290 L 480 320 L 460 360 L 420 420 L 380 480 L 330 550 L 290 620 L 260 550 L 220 480 L 170 420 L 150 340 L 140 260 L 180 180 L 210 120 Z" fill="#0b1329" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.8" />
                
                <!-- Regional Boundaries Representation -->
                <!-- North / Gangetic -->
                <path d="M 210 120 L 270 140 L 350 180 L 320 230 L 250 200 Z" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(255, 255, 255, 0.06)" />
                <!-- West (Gujarat / Rajasthan) -->
                <path d="M 140 260 L 230 250 L 210 390 L 150 340 Z" fill="rgba(249, 115, 22, 0.08)" stroke="rgba(255, 255, 255, 0.06)" />
                <!-- Central / Maharashtra -->
                <path d="M 210 390 L 340 370 L 320 490 L 220 480 Z" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(255, 255, 255, 0.06)" />

                <!-- Dynamic Bezier Corridors Group -->
                <g id="svgCorridorArcs"></g>

                <!-- State Capital / Hub Anchors -->
                <g id="svgCityNodes">
                  <!-- Patna -->
                  <circle cx="410" cy="310" r="5" fill="#f97316" />
                  <text x="420" y="315" fill="#e2e8f0" font-size="11" font-weight="700">Patna</text>

                  <!-- Surat -->
                  <circle cx="200" cy="400" r="7" fill="#10b981" />
                  <text x="145" y="405" fill="#34d399" font-size="12" font-weight="800">Surat</text>

                  <!-- Mumbai -->
                  <circle cx="210" cy="450" r="6" fill="#38bdf8" />
                  <text x="150" y="455" fill="#93c5fd" font-size="11" font-weight="700">Mumbai</text>

                  <!-- Varanasi -->
                  <circle cx="370" cy="320" r="5" fill="#f59e0b" />
                  <text x="315" y="325" fill="#cbd5e1" font-size="10">Varanasi</text>

                  <!-- Ahmedabad -->
                  <circle cx="190" cy="360" r="5" fill="#60a5fa" />
                  <text x="115" y="365" fill="#cbd5e1" font-size="10">Ahmedabad</text>

                  <!-- Ganjam -->
                  <circle cx="390" cy="440" r="5" fill="#f97316" />
                  <text x="400" y="445" fill="#cbd5e1" font-size="10">Ganjam</text>

                  <!-- Jaipur -->
                  <circle cx="230" cy="280" r="5" fill="#f59e0b" />
                  <text x="185" y="285" fill="#cbd5e1" font-size="10">Jaipur</text>

                  <!-- Murshidabad -->
                  <circle cx="460" cy="350" r="5" fill="#a855f7" />
                  <text x="470" y="355" fill="#cbd5e1" font-size="10">Murshidabad</text>
                </g>
              </svg>

              <div class="map-legend-overlay">
                <div><span class="legend-dot high"></span> High Flow Corridor (&gt;1,000)</div>
                <div><span class="legend-dot med"></span> Moderate (500 - 1,000)</div>
                <div><span class="legend-dot low"></span> Emerging (&lt;500)</div>
                <span class="demo-chip" style="margin-left:auto; font-size:0.62rem;">SYNTHETIC DEMO</span>
              </div>
            </div>
          </div>

          <!-- Right: Corridor Detail Panel -->
          <div class="corridor-drawer-card" id="corridorDetailPanel">
            <!-- Populated dynamically by JS -->
          </div>
        </div>
      </div>
    </section>
  <script src="js/app.js"></script>
</body>
</html>
